<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin: 25px 0;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 10px;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin: 10px 0;
            background: #f8f8f8;
            border-radius: 8px;
        }

        .task span {
            flex: 1;
            margin-left: 10px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete {
            background: #d9534f;
            padding: 8px 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📚 Student Task Manager</h1>

        <div class="input-box">
            <input type="text" id="taskInput"
                   placeholder="Enter your task">

            <button onclick="addTask()">Add</button>
        </div>

        <div class="stats">
            <p>Total: <b id="total">0</b></p>
            <p>Completed: <b id="completed">0</b></p>
            <p>Pending: <b id="pending">0</b></p>
        </div>

        <div id="taskList"></div>

    </div>


    <script>

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function addTask() {

            let input = document.getElementById("taskInput");

            let taskText = input.value.trim();

            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            tasks.push({
                text: taskText,
                completed: false
            });

            input.value = "";

            saveTasks();
            displayTasks();
        }


        function displayTasks() {

            let taskList = document.getElementById("taskList");

            taskList.innerHTML = "";

            tasks.forEach((task, index) => {

                let div = document.createElement("div");

                div.className = "task";

                div.innerHTML = `
                    <input type="checkbox"
                           ${task.completed ? "checked" : ""}
                           onchange="completeTask(${index})">

                    <span class="${task.completed ? "completed" : ""}">
                        ${task.text}
                    </span>

                    <button class="delete"
                            onclick="deleteTask(${index})">
                        Delete
                    </button>
                `;

                taskList.appendChild(div);
            });

            updateStats();
        }


        function completeTask(index) {

            tasks[index].completed =
                !tasks[index].completed;

            saveTasks();
            displayTasks();
        }


        function deleteTask(index) {

            tasks.splice(index, 1);

            saveTasks();
            displayTasks();
        }


        function updateStats() {

            let total = tasks.length;

            let completed =
                tasks.filter(task => task.completed).length;

            let pending = total - completed;

            document.getElementById("total").innerText = total;

            document.getElementById("completed").innerText =
                completed;

            document.getElementById("pending").innerText =
                pending;
        }


        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );
        }


        displayTasks();

    </script>

</body>
</html>
